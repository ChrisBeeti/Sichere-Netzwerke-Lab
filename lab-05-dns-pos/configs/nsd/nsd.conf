# =============================================================================
#  nsd.conf  –  Lab 05  autoritativer Name-Server fuer bank.local
#  Liefert immer die DNSSEC-signierte Zone aus. Ob die Signatur geprueft
#  wird, entscheidet allein der Resolver (Stufe 3).
# =============================================================================

server:
    server-count: 1
    ip-address: 0.0.0.0
    port: 53
    zonesdir: "/etc/nsd/zones"
    logfile: ""
    verbosity: 1
    hide-version: yes

zone:
    name: "bank.local"
    zonefile: "bank.local.zone.signed"
