<style>
:root {
  --bg: #0f1117;
  --bg2: #161b27;
  --bg3: #1e2436;
  --border: rgba(255,255,255,0.08);
  --border2: rgba(255,255,255,0.15);
  --text: #e8eaf0;
  --text2: #8b92a8;
  --text3: #555d74;
  --blue: #4a9eff;
  --blue-bg: rgba(74,158,255,0.12);
  --green: #3dd68c;
  --green-bg: rgba(61,214,140,0.12);
  --amber: #f5a623;
  --amber-bg: rgba(245,166,35,0.12);
  --red: #ff5f5f;
  --red-bg: rgba(255,95,95,0.12);
  --purple: #a78bfa;
  --purple-bg: rgba(167,139,250,0.12);
  --pink: #f472b6;
  --pink-bg: rgba(244,114,182,0.12);
  --teal: #2dd4bf;
  --teal-bg: rgba(45,212,191,0.12);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Courier New', Courier, monospace;
  min-height: 100vh;
}
header {
  border-bottom: 1px solid var(--border);
  padding: 1.25rem 2rem;
  display: flex;
  align-items: center;
  gap: 1rem;
  background: var(--bg2);
}
.logo-badge {
  background: var(--blue-bg);
  border: 1px solid rgba(74,158,255,0.3);
  color: var(--blue);
  padding: 4px 10px;
  border-radius: 4px;
  font-size: 11px;
  letter-spacing: 1px;
  text-transform: uppercase;
}
header h1 {
  font-size: 14px;
  color: var(--text);
  font-weight: normal;
  letter-spacing: 0.5px;
}
header .sub {
  font-size: 12px;
  color: var(--text3);
  margin-left: auto;
}
.layout {
  display: grid;
  grid-template-columns: 220px 1fr;
  min-height: calc(100vh - 60px);
}
.sidebar {
  background: var(--bg2);
  border-right: 1px solid var(--border);
  padding: 1.5rem 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.sidebar-section {
  padding: 0.5rem 1rem 0.25rem;
  font-size: 10px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--text3);
  margin-top: 0.75rem;
}
.sidebar-section:first-child { margin-top: 0; }
.cat-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 1rem;
  cursor: pointer;
  font-size: 12px;
  color: var(--text2);
  border: none;
  background: none;
  text-align: left;
  width: 100%;
  border-left: 2px solid transparent;
  transition: all .15s;
  font-family: inherit;
}
.cat-btn:hover { background: var(--bg3); color: var(--text); }
.cat-btn.active { border-left-color: var(--blue); background: var(--blue-bg); color: var(--blue); }
.cat-btn i { font-size: 14px; }
.main {
  display: grid;
  grid-template-columns: 260px 1fr;
}
.mime-list-col {
  border-right: 1px solid var(--border);
  padding: 1.25rem 0;
  overflow-y: auto;
  max-height: calc(100vh - 60px);
}
.mime-item {
  padding: 10px 1.25rem;
  cursor: pointer;
  border-left: 2px solid transparent;
  transition: all .12s;
}
.mime-item:hover { background: var(--bg3); }
.mime-item.selected { border-left-color: var(--green); background: rgba(61,214,140,0.07); }
.mime-item .mname {
  font-size: 12px;
  color: var(--text);
  font-family: 'Courier New', monospace;
  font-weight: bold;
}
.mime-item.selected .mname { color: var(--green); }
.mime-item .mdesc {
  font-size: 11px;
  color: var(--text3);
  margin-top: 2px;
}
.detail-col {
  padding: 2rem;
  overflow-y: auto;
  max-height: calc(100vh - 60px);
  display: flex;
  flex-direction: column;
  gap: 1.5rem;
}
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 100%;
  gap: 12px;
  color: var(--text3);
}
.empty-state i { font-size: 36px; }
.empty-state p { font-size: 13px; }
.detail-title {
  font-size: 20px;
  color: var(--text);
  font-family: 'Courier New', monospace;
  font-weight: bold;
}
.detail-sub { font-size: 13px; color: var(--text2); margin-top: 4px; }
.section-label {
  font-size: 10px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--text3);
  margin-bottom: 8px;
}
.anatomy-box {
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 1rem 1.25rem;
}
.anatomy-row {

  gap: 0;
  font-family: 'Courier New', monospace;
  font-size: 15px;
  margin-bottom: 6px;
}

.aslash { padding: 4px 4px; color: var(--text3); }
.asub { background: rgba(61,214,140,0.2); color: var(--green); padding: 4px 10px; border-radius: 0 4px 4px 0; font-weight: bold; }
.aparam { color: var(--text3); font-size: 12px; padding: 4px 8px; }
.anat-labels { display: flex; gap: 0; font-size: 10px; margin-top: 4px; color: var(--text3); letter-spacing: 0.5px; }

.al-sub { padding: 0 10px; color: rgba(61,214,140,0.6); }
.http-box {
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 1rem 1.25rem;
  font-family: 'Courier New', monospace;
  font-size: 12px;
}
.hkey { color: var(--blue); font-weight: bold; }
.hval { color: var(--green); }
.use-text { font-size: 13px; color: var(--text2); line-height: 1.7; }
.badge-row { display: flex; gap: 8px; flex-wrap: wrap; }
.badge {
  padding: 4px 12px;
  border-radius: 4px;
  font-size: 11px;
  font-weight: bold;
  letter-spacing: 0.5px;
}
.b-low { background: var(--green-bg); color: var(--green); border: 1px solid rgba(61,214,140,0.3); }
.b-med { background: var(--amber-bg); color: var(--amber); border: 1px solid rgba(245,166,35,0.3); }
.b-high { background: var(--red-bg); color: var(--red); border: 1px solid rgba(255,95,95,0.3); }
.preview-box {
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 6px;
  overflow: hidden;
}
.preview-header {
  background: rgba(255,255,255,0.04);
  border-bottom: 1px solid var(--border);
  padding: 8px 1.25rem;
  font-size: 10px;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: var(--text3);
  display: flex;
  align-items: center;
  gap: 6px;
}
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
pre.pcode {
  padding: 1rem 1.25rem;
  font-family: 'Courier New', monospace;
  font-size: 12px;
  color: var(--text);
  white-space: pre-wrap;

  line-height: 1.7;

.swatch-row { padding: 1rem 1.25rem; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.swatch { width: 44px; height: 44px; border-radius: 4px; border: 1px solid var(--border); }
.swatch-note { font-size: 11px; color: var(--text3); line-height: 1.6; max-width: 300px; }

/* QUIZ */
.quiz-section {
  background: var(--bg2);
  border-top: 1px solid var(--border);
  padding: 1.5rem 2rem;
  margin-top: auto;
}
.quiz-box {
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 1.25rem;
}
.quiz-q { font-size: 13px; color: var(--text); margin-bottom: 1rem; line-height: 1.6; }
.quiz-q strong { color: var(--amber); }
.quiz-opts { display: flex; flex-direction: column; gap: 6px; }
.quiz-opt {
  padding: 8px 14px;
  border: 1px solid var(--border);
  border-radius: 4px;
  font-size: 12px;
  font-family: 'Courier New', monospace;
  cursor: pointer;
  color: var(--text2);
  background: none;
  text-align: left;
  transition: all .12s;
}
.quiz-opt:hover { border-color: var(--border2); color: var(--text); background: rgba(255,255,255,0.04); }
.quiz-opt.correct { border-color: var(--green); background: var(--green-bg); color: var(--green); }
.quiz-opt.wrong { border-color: var(--red); background: var(--red-bg); color: var(--red); }
.quiz-feedback { margin-top: 10px; font-size: 12px; line-height: 1.6; padding: 8px 12px; border-radius: 4px; display: none; }
.quiz-feedback.show { display: block; }
.quiz-feedback.ok { background: var(--green-bg); color: var(--green); border: 1px solid rgba(61,214,140,0.3); }
.quiz-feedback.fail { background: var(--red-bg); color: var(--red); border: 1px solid rgba(255,95,95,0.3); }
.quiz-reset {
  margin-top: 10px;
  padding: 6px 14px;
  border: 1px solid var(--border);
  border-radius: 4px;
  font-size: 11px;
  color: var(--text3);
  background: none;
  cursor: pointer;
  font-family: inherit;
  display: none;
}
.quiz-reset.show { display: inline-block; }
.quiz-reset:hover { color: var(--text2); border-color: var(--border2); }
</style>
</head>

function renderSidebar(){
  const sb = document.getElementById('sidebar');
  sb.innerHTML = '<div class="sidebar-section">Kategorien</div>' +
    CATS.map(c=>`<button class="cat-btn ${c.id===activeCat?'active':''}" onclick="selectCat('${c.id}')">
      <i class="ti ${c.icon}"></i>${c.label}
    </button>`).join('');
}

function renderList(){
  const items = MIMES.filter(m=>m.cat===activeCat);
  document.getElementById('mimeListCol').innerHTML =
    items.map(m=>`<div class="mime-item ${selectedMime===m.full?'selected':''}" onclick="selectMime('${m.full}')">
      <div class="mname">${m.full}</div>
      <div class="mdesc">${m.desc}</div>
    </div>`).join('');
}

function renderDetail(m){
  const dc = document.getElementById('detailCol');
  const paramRow = m.param?`<span class="aslash">;</span><span class="aparam"> ${m.param}</span>`:'';
  const riskCls = m.risk==='low'?'b-low':m.risk==='med'?'b-med':'b-high';
  let previewInner='';
  if(m.preview==='code'){
    previewInner=`<pre class="pcode">${m.code}</pre>`;
  } else {
    previewInner=`<div class="swatch-row">
      ${m.swatches.map(c=>`<div class="swatch" style="background:${c}"></div>`).join('')}
      <span class="swatch-note">Bilddaten als Binär-Bytes gespeichert – kein Text, kein Script möglich.</span>
    </div>`;
  }

  const q = QUIZ[quizIdx];
  const optHtml = q.opts.map((o,i)=>`<button class="quiz-opt" id="qo${i}" onclick="answerQuiz(${i})">${o}</button>`).join('');

  dc.innerHTML = `
    <div>
      <div class="detail-title">${m.full}</div>
      <div class="detail-sub">${m.desc}</div>
    </div>
    <div class="anatomy-box">
      <div class="section-label">Aufbau des MIME-Types</div>
      <div class="anatomy-row">
        <span class="atype">${m.cat}</span>
        <span class="aslash">/</span>
        <span class="asub">${m.sub}</span>
        ${paramRow}
      </div>
      <div class="anat-labels">
        <span class="al-type">Haupttyp</span>
        <span class="al-sub">Subtyp</span>
      </div>
    </div>
    <div class="http-box">
      <div class="section-label">HTTP-Header Beispiel</div>
      <span class="hkey">Content-Type: </span><span class="hval">${m.header.replace('Content-Type: ','')}</span>
    </div>
    <div>
      <div class="section-label">Verwendung</div>
      <div class="use-text">${m.use}</div>
    </div>
    <div>
      <div class="section-label">Sicherheitsrelevanz</div>
      <div class="badge-row"><span class="badge ${riskCls}">${m.riskLabel}</span></div>
    </div>
    <div class="preview-box">
      <div class="preview-header">
        <span class="dot" style="background:var(--red)"></span>
        <span class="dot" style="background:var(--amber)"></span>
        <span class="dot" style="background:var(--green)"></span>
        &nbsp; Inhalt / Beispiel
      </div>
      ${previewInner}
    </div>
    <div style="border-top:1px solid var(--border);padding-top:1.5rem">
      <div class="section-label" style="color:var(--amber)">Quizfrage ${quizIdx+1} / ${QUIZ.length}</div>
      <div class="quiz-box">
        <div class="quiz-q">${q.q}</div>
        <div class="quiz-opts">${optHtml}</div>
        <div class="quiz-feedback" id="qfb"></div>
        <button class="quiz-reset" id="qreset" onclick="nextQuiz()">Nächste Frage →</button>
      </div>
    </div>`;
  quizAnswered=false;
}

function answerQuiz(i){
  if(quizAnswered) return;
  quizAnswered=true;
  const q=QUIZ[quizIdx];
  const fb=document.getElementById('qfb');
  const reset=document.getElementById('qreset');
  for(let j=0;j<q.opts.length;j++){
    const el=document.getElementById('qo'+j);
    if(j===q.correct) el.classList.add('correct');
    else if(j===i) el.classList.add('wrong');
  }
  fb.innerHTML=q.fb;
  fb.className='quiz-feedback show '+(i===q.correct?'ok':'fail');
  reset.className='quiz-reset show';
}

function nextQuiz(){
  quizIdx=(quizIdx+1)%QUIZ.length;
  if(selectedMime){
    const m=MIMES.find(x=>x.full===selectedMime);
    if(m) renderDetail(m);
  }
}

function selectCat(id){
  activeCat=id;
  selectedMime=null;
  renderSidebar();
  renderList();
  document.getElementById('detailCol').innerHTML=`<div class="empty-state"><i class="ti ti-hand-click"></i><p>MIME-Typ in der Liste auswählen</p></div>`;
}

function selectMime(full){
  selectedMime=full;
  renderList();
  const m=MIMES.find(x=>x.full===full);
  if(m) renderDetail(m);
}

renderSidebar();
renderList();
</script>
</body>
</html>
