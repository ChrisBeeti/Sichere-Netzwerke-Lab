# =============================================================================
#  unbound.conf  –  Lab 05  (Stufe 1 + 2: OHNE DNSSEC-Validierung)
#  Rekursiver, cachender Resolver. bank.local wird per Stub an auth-dns
#  (10.50.0.54) delegiert. Validierung ist hier bewusst AUS.
# =============================================================================

server:
    interface: 0.0.0.0
    port: 53
    do-ip4: yes
    do-udp: yes
    do-tcp: yes
    access-control: 10.50.0.0/24 allow
    access-control: 127.0.0.0/8 allow

    # Nur Iterator – KEINE Validierung. So akzeptiert der Resolver in
    # Stufe 2 die gefaelschte (unsignierte) Antwort und legt sie im Cache ab.
    module-config: "iterator"

    # Cache sichtbar machen (Lerneffekt). Niedrige Minima, damit der
    # vergiftete Eintrag nicht kuenstlich lange ueberlebt.
    cache-min-ttl: 0
    cache-max-ttl: 86400
    verbosity: 1
    log-queries: yes
    use-syslog: no
    logfile: ""
    chroot: ""
    username: ""
    directory: "/etc/unbound"
    pidfile: "/etc/unbound/unbound.pid"

remote-control:
    control-enable: yes
    control-interface: 127.0.0.1
    control-use-cert: no

# bank.local ist keine echte TLD -> als Stub-Zone an den autoritativen
# Server delegieren. Damit recurse-t unbound korrekt zu auth-dns.
stub-zone:
    name: "bank.local."
    stub-addr: 10.50.0.54
