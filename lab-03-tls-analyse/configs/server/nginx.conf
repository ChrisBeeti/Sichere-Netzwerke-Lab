events {
    worker_processes 1;
}

http {
    # ─── HTTPS-Server (TLS 1.2 + TLS 1.3) ─────────────────────────────────────
    server {
        listen 443 ssl;
        server_name lab03.fom.local 10.30.0.10;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        # Beide Versionen aktiv lassen → Aufgabe 4 (Versionsvergleich)
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;

        # Session-Tickets deaktivieren → bessere Analyse-Sicht
        ssl_session_tickets off;

        location / {
            root /usr/share/nginx/html;
            index index.html;
        }

        location /api/secret {
            add_header Content-Type application/json;
            return 200 '{"status":"ok","message":"Nur mit TLS sichtbar","data":"S3cr3tD4ta"}';
        }

        location /api/public {
            add_header Content-Type application/json;
            return 200 '{"status":"ok","message":"Oeffentlicher Endpunkt"}';
        }
    }

    # ─── HTTP (unverschlüsselt) für Vergleich ──────────────────────────────────
    server {
        listen 80;
        server_name lab03.fom.local 10.30.0.10;

        location / {
            root /usr/share/nginx/html;
            index index.html;
        }

        location /api/secret {
            add_header Content-Type application/json;
            return 200 '{"status":"ok","message":"ACHTUNG: Unverschluesselt!","data":"S3cr3tD4ta"}';
        }
    }
}
